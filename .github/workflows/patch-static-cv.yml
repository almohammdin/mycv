name: Patch static CV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-static-cv.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch static HTML
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          portrait = '''<div class="header-identity">
            <div class="profile-portrait web-only">
              <div class="profile-portrait-frame">
                <img src="./assets/naif-profile.jpg?v=202608061325" alt="صورة نايف المحمدي | Portrait of Naif Almohammdi">
              </div>
            </div>'''
          s = s.replace('<div class="header-identity">', portrait)

          css = '''
<style id="cv-static-final">
@media screen {
  body { line-height:1.56; font-synthesis:none; -webkit-font-smoothing:antialiased; }
  body[lang="en"] { line-height:1.5; }
  .top-bar-inner { position:relative; min-height:42px; justify-content:center !important; }
  .top-bar-inner > div { display:contents !important; }
  .top-bar-inner .lang-row { margin:auto; }
  .top-bar-inner .btn-download { position:absolute; inset-inline-end:24px; top:50%; transform:translateY(-50%); }
  .top-bar-inner .btn-download:hover { transform:translateY(calc(-50% - 1px)); }
  .header { padding:32px 42px 31px !important; }
  .header-identity { display:grid !important; grid-template-columns:minmax(0,1fr) 218px; gap:28px; align-items:center; margin-bottom:18px; }
  .header-identity-copy { grid-column:1; grid-row:1; min-width:0; display:flex; flex-direction:column; align-items:center; text-align:center; }
  .profile-portrait { grid-column:2; grid-row:1; width:218px; height:286px; padding:7px; border-radius:27px; background:linear-gradient(145deg,#fff,#ecf1f7); border:1px solid rgba(201,168,76,.42); box-shadow:0 18px 40px rgba(0,0,0,.22); overflow:hidden; }
  .profile-portrait-frame { width:100%; height:100%; overflow:hidden; border-radius:20px; background:#eef2f7; }
  .profile-portrait img { display:block; width:100%; height:100%; object-fit:cover; object-position:center top; }
  .header-identity-copy > .naif-logo { order:1; width:96px !important; max-width:28vw !important; margin:0 auto 8px !important; }
  .header-identity-copy > h1 { order:2; margin:0 0 7px !important; font-size:clamp(2.1rem,4.3vw,3rem) !important; line-height:1.15 !important; }
  .header-identity-copy > .rcoa-badge { order:3; display:block !important; margin:0 0 17px !important; padding:0 !important; border:0 !important; background:transparent !important; color:var(--gold) !important; font-size:.9rem !important; line-height:1.4 !important; }
  .header-identity-copy > .rcoa-badge::before { display:none !important; }
  .header-identity-copy > .header-title { order:4; width:100%; margin:0 !important; padding:0 0 16px !important; line-height:1.48 !important; }
  .contact-row,.phone-row { justify-content:center; }
  .hook-box p,.hook-box li,.achievement,.desc,.desc li,.cert-desc,.tool-desc,.knowledge-product-desc { line-height:1.52 !important; }
  footer { padding:13px 20px 15px !important; }
  footer .footer-inner { gap:5px !important; }
  footer .footer-naif-logo { width:78px !important; }
  footer .footer-copy { margin-top:1px !important; padding-top:7px !important; font-size:.72rem !important; }
}
@media screen and (max-width:768px) {
  .top-bar-inner .btn-download { inset-inline-end:12px; width:40px; height:40px; padding:0; justify-content:center; }
  .top-bar-inner .btn-download span { display:none; }
  .header { padding:27px 20px 25px !important; }
  .header-identity { grid-template-columns:minmax(0,1fr) 170px; gap:18px; }
  .profile-portrait { width:170px; height:232px; }
  .header-identity-copy > .naif-logo { width:82px !important; }
}
@media screen and (max-width:560px) {
  .header-identity { grid-template-columns:1fr; }
  .profile-portrait { grid-column:1; grid-row:1; width:min(100%,215px); height:276px; justify-self:center; }
  .header-identity-copy { grid-column:1; grid-row:2; }
}
@media print { .profile-portrait { display:none !important; } }
.pdf-document .profile-portrait { display:none !important; }
</style>
'''
          s = s.replace('</head>', css + '</head>', 1)

          s = s.replace('<strong>نايف المحمدي</strong><br>\n          المؤسس والمستشار الاستراتيجي | شركة حتى لحلول الأعمال', 'مستشار الحوكمة وتطوير الأعمال')
          s = s.replace('© 2026 نايف المحمدي | السيرة المهنية | الإصدار 2.8', '© 2026 | السيرة المهنية | الإصدار 2.8')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate
        run: |
          grep -q './assets/naif-profile.jpg?v=202608061325' index.html
          grep -q 'cv-static-final' index.html
          ! grep -q '{%' index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/patch-static-cv.yml
          git rm -f assets/naif-profile-original.jpg || true
          git add index.html
          git commit -m "fix: add portrait to static CV" || true
          git push origin HEAD:main
