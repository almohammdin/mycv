name: Review personal CV redesign
on:
  push:
    branches: [codex/cv-brand-20261026]
permissions:
  contents: write
jobs:
  review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install rendering tools
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python -m pip install pypdf pillow
          sudo apt-get install -y poppler-utils
      - name: Prepare brand fonts
        run: node scripts/download-brand-fonts.mjs
      - name: Review website and create sharing image
        run: node scripts/review-design.mjs
      - name: Generate PDF files
        run: |
          mkdir -p review
          PDF_REVIEW_DIR=review node scripts/generate-pdfs.mjs
      - name: Verify PDFs
        run: python scripts/verify-pdfs.py
      - name: Render PDF contact sheets
        if: always()
        run: |
          mkdir -p review
          python scripts/render-pdf-review.py
      - name: Save review outputs on review branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fonts assets/social/naif-link-preview-v3.png review Naif-Almohammdi-CV-*.pdf
          git diff --cached --quiet && exit 0
          git commit -m "Build CV review outputs"
          git push
