name: Generate CV PDFs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
      - scripts/generate-pdfs.mjs
      - .github/workflows/generate-cv-pdfs.yml

permissions:
  contents: write

concurrency:
  group: cv-pdf-generation
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PDF runtime and IBM Plex fonts
        run: |
          npm install --no-save playwright @fontsource/ibm-plex-sans-arabic @fontsource/ibm-plex-sans
          npx playwright install --with-deps chromium

      - name: Generate Arabic and English PDFs
        run: node scripts/generate-pdfs.mjs

      - name: Verify PDFs
        run: |
          test -s Naif-Almohammdi-CV-AR.pdf
          test -s Naif-Almohammdi-CV-EN.pdf

      - name: Publish generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Naif-Almohammdi-CV-AR.pdf Naif-Almohammdi-CV-EN.pdf
          git diff --cached --quiet && exit 0
          git commit -m "تحديث ملفات السيرة PDF"
          git push
