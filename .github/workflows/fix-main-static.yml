name: Fix main CV static page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-main-static.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build direct static page and real portrait
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, re

          # Always build from the complete static source, never from a loader wrapper.
          source_path = Path('index-source.html')
          index_path = Path('index.html')
          html = source_path.read_text(encoding='utf-8') if source_path.exists() else index_path.read_text(encoding='utf-8')

          # Decode the portrait into a genuine binary JPEG.
          b64 = ''.join(Path('assets/portrait-base64.txt').read_text(encoding='utf-8').split())
          image = base64.b64decode(b64, validate=True)
          if not image.startswith(b'\xff\xd8\xff') or len(image) < 10000:
              raise SystemExit('Portrait JPEG is invalid')
          Path('assets/naif-profile.jpg').write_bytes(image)

          # Remove any previous loading wrapper references and use the real image.
          html = re.sub(r'<div class="cv-loading"[^>]*>.*?</div>', '', html, flags=re.S)
          html = html.replace('./assets/naif-profile.webp', './assets/naif-profile.jpg')
          html = html.replace('./assets/naif-profile.png', './assets/naif-profile.jpg')

          # Add cache-control metadata once.
          if 'http-equiv="Cache-Control"' not in html:
              cache_meta = '''\n<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">\n<meta http-equiv="Pragma" content="no-cache">\n<meta http-equiv="Expires" content="0">'''
              html = html.replace('</head>', cache_meta + '\n</head>', 1)

          # Kill any stale service worker/cache from earlier loader versions.
          cleanup = '''<script id="cv-cache-cleanup">\n(function(){\n  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});});\n  if ('caches' in window) caches.keys().then(function(keys){keys.forEach(function(k){caches.delete(k);});});\n})();\n</script>'''
          if 'id="cv-cache-cleanup"' not in html:
              html = html.replace('</head>', cleanup + '\n</head>', 1)

          # Remove any obsolete async loader script that fetched index-source.html.
          html = re.sub(r'<script[^>]*>\s*\(async function \(\).*?fetch\([\'\"]\./index-source\.html.*?</script>', '', html, flags=re.S)

          index_path.write_text(html, encoding='utf-8')
          Path('.nojekyll').write_text('', encoding='utf-8')
          PY

      - name: Validate direct page
        run: |
          test -s index.html
          test -s assets/naif-profile.jpg
          grep -q 'نايف المحمدي' index.html
          ! grep -q 'جاري تحميل السيرة' index.html
          python3 - <<'PY'
          from pathlib import Path
          data = Path('assets/naif-profile.jpg').read_bytes()
          assert data[:3] == b'\xff\xd8\xff'
          assert len(data) > 10000
          print('JPEG bytes:', len(data))
          PY

      - name: Commit fixed main source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fix-main-static.yml
          git add index.html assets/naif-profile.jpg .nojekyll
          git commit -m "fix: publish CV directly from main" || true
          git push origin HEAD:main
