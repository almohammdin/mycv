name: Publish versioned CV path

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-versioned-cv.yml'
      - '.github/versioned-cv-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Create fresh versioned path
        run: |
          cp index.html cv-2026.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv-2026.html
          git commit -m "deploy: add fresh CV path" || true
          git push origin gh-pages
